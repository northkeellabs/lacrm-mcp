[project]
name = "lacrm-mcp"
version = "0.1.0"
description = "Unofficial MCP server for the Less Annoying CRM (LACRM) API v2, with read-only mode and defensive defaults."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Northkeel Labs", email = "hello@northkeellabs.com" }]
keywords = ["mcp", "model-context-protocol", "crm", "lacrm", "claude"]
dependencies = [
    "mcp>=1.9,<2",
    "httpx>=0.27,<1",
    "pydantic>=2.6,<3",
]

[project.urls]
Repository = "https://github.com/northkeellabs/lacrm-mcp"
Issues = "https://github.com/northkeellabs/lacrm-mcp/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
lacrm-mcp = "lacrm_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lacrm_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
